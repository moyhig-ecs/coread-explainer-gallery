*{box-sizing:border-box}

/* figure.css — everything that is not the Anatomy kit's own sheet (moy-1). Scoped to .sh so it can live inside a notebook cell.

.sh{--fig-a:var(--anatomy-blue);--fig-b:#ff9d47;--fig-amber:#ffbf47}

.sh-steps{display:flex;gap:4px;flex-wrap:wrap}.sh-stepgrp{display:inline-flex;gap:4px;padding-right:10px;margin-right:6px;border-right:1px solid var(--anatomy-lo)}.sh-stepgrp:last-child{border-right:0;margin-right:0;padding-right:0}

        { id: "R01", lv: "L3", text: "足した一文は共円で止まる答えを不十分とし、その後の行は書き始めで分かれる(cue \\n\\n の 10 行・相関)。cue をまたぐと位置 0 の書き始めでは説明されない(olm128 = 10-28 の後の札・状態 35)= cue \\n\\n の中だけの読み。(読み: M1 の下書き・実行層。採否は人間)", src: "BRIEF §4 · K06・K07・K08" },
        { id: "R02", lv: "L3", text: `上位 10 head の重なり(Jaccard の平均)は cut ~ att ${Number(Q.J["cut~att"]).toFixed(3)}・cut ~ cut ${Number(Q.J["cut~cut"]).toFixed(3)}・cut ~ 結論の bind ${Number(Q.J["cut~concl_bind"]).toFixed(3)}(K14 は全桁)。bind の瞬間と attractor の瞬間が同じ部品か別の部品かは言わない(機構は見ていない)。(読み: RESULT cmt13 §5 の実行層。採否は人間)`, src: "RESULT cmt13 §5 · K11〜K14" },
        { id: "R03", lv: "L3", text: "O1O2 と He・Hi は、SAE の推移の上で対称でない: O1O2 を名指した後は考えの中点の群が上がり、答えの側と結びの群が下がる。He・Hi を名指した所では、差の中央値が小さい。(読み: RESULT olm59 §5-1 を、数に合わせて作り手が言い直した。実行層の読み。採否は人間)", src: "RESULT olm59 §5-1 · K25・K26" },
        { id: "R04", lv: "L3", text: "結びの群が下がるのは、O1O2 を名指した時点ではまだ答えを閉じていない、と読める。答えの欄で bind に着く行でも同じ(後 > 前は 8 / 53)。(読み: RESULT olm59 §5-3 の実行層。採否は人間)", src: "RESULT olm59 §5-3 · K25" },
        { id: "X01", lv: "x", text: "「考えたから bind した」とは言わない。書き始めと label の対応は相関で、cmt5 の介入は統制 C1 が落ちて読みが保留。cmt5 の bind は、全文の label か答えの欄の label かを書かずに言わない(考えの道 40 / 40 は全文・36 / 40 は答えの欄)。", src: "K07 · K16 · K28" },
        { id: "X02", lv: "x", text: "block の効果を cue をまたいで言わない。blocked の bind は cue で 2 / 9 から 7 / 10。", src: "K10" },
        { id: "X03", lv: "x", text: "「O の組・He の組」を回路・担い手とは言わない。上位 10 head に出た回数からの事後の名付けで、一つの model・F5 の 2 変種。", src: "K11〜K14" },
        { id: "X04", lv: "x", text: "3・4 章の行と 5 章の行を同じ prompt とは言わない。F5a-2 は単一変数の編集(⑥ 出力の順)を入れた変種。", src: "f5_runs_F5a-2.json single_variable" },
        { id: "X05", lv: "x", text: "open の「attractor 5」を「答えが He・Hi に向いた」とは言わない。全文の label で、答えの欄に He・Hi は 0。", src: "K03 · K05" },
        { id: "X06", lv: "x", text: "6 章の model を一つの曲線・順位にしない。集計しない・Qwen と frontier は採点の経路も別。base と Think も単一変数の比べではない。", src: "K17 · K18" },
        { id: "X07", lv: "x", text: "「He・Hi の直径の円は X1〜X4 を通らない」は座標の計算で言える範囲(この一つの配置)まで。", src: "K19" },
        { id: "X08", lv: "x", text: "model が考えた・迷った・気づいた・本当は分かっていた、とは言わない。数えたのは文の形が本文に在る位置と、凍結の label。", src: "全画面" },
        { id: "X09", lv: "x", text: "「model が O1O2 で考え始めた」「He・Hi では考えなかった」とは言わない。数えたのは、本文の述語が当たった token の前後 32 token の群の値の平均の差。", src: "K25・K26" },
        { id: "X10", lv: "x", text: "活性は相関で、因果(活性が bind を決める)は言わない。群の名は unembed の上位の語からの名付けで、意味の同定ではない。結びの latent = commit の正体、とは言わない。", src: "K22・K25" },
        { id: "X11", lv: "x", text: "考えの中点の群の上がりは、本文が計算(Let's check・座標)に移ったことの写しかもしれず、本札はそれを分けていない。", src: "K23・K25 · RESULT olm59 §5-2" },
        { id: "X12", lv: "x", text: "attractor の行の O の出来事は 3 本で、読まない。S_O・S_H は述語で選んだ最短の一行ずつで、代表でも、対の比べでもない。", src: "K23・K24・K25" },

        { id: "K56", lv: "L1", text: `最後の位置で行いを運ぶ上位 10 head は、指す先の直径の名を他方の ${hd.ratio.toFixed(2)} 倍読む(注意 ${c3(hd.share.ref_name)} 対 ${c3(hd.share.oth_name)})。出力を対の文の物に置くと行いが ${fmt.f2(hd.e_top)} logit(乱数の 10 head との差 ${fmt.f2(hd.top_minus_rand)}・反転 ${c3(hd.flip)})。上位 10 のうち ${hd.overlap.length} 個(${hd.overlap.join("・")})は cmt13 の head と同じ。`, src: "olm98 read.json Q1_top_heads_read_ref_name · Q2_patch_top_heads · Q4_cmt13_overlap" },
        { id: "K57", lv: "L1", text: `位置の入れ替えで、行いが source の指し / 値に従った割合(評価の組): 選びの文字だけ(olm106)層 12 で指し ${c3(g(ly.sel, 12, "po"))}・層 16 で ${c3(g(ly.sel, 16, "po"))}・層 20 で ${c3(g(ly.sel, 20, "po"))}(値は ≤ ${c3(ly.sel.reduce((m, r2) => Math.max(m, r2.vo), 0))})・最後の位置だけ(olm101)値に従う最初の層は ${ly.end_val_first}(層 28 で ${c3(g(ly.end, 28, "vo"))})・選びから最後まで(olm108)層 20 で指し ${c3(g(ly.tail, 20, "po"))} / 値 ${c3(g(ly.tail, 20, "vo"))}。`, src: "olm106 table.sel_L* · olm101 Q1_curve_full_end · olm108 Q1.curve_tail" },
        { id: "K58", lv: "L1", text: `答えの欄が apex の ${a1.Q1.bind} 行の証明の欄: 二等分線 ${a1.bind.BIS}・直角 ${a1.bind.RA}・Thales の逆 ${a1.bind.THC}・鎖(三つ全部)${a1.Q1.chain}(Q1 偽)。hypothesis の申告は apex ${a1.Q2.bind_hyp} / ${a1.Q2.bind_hq}・attractor ${a1.Q2.attr_hyp} / ${a1.Q2.attr_hq}。attractor の率 ${c3(a1.Q3.new_rate)} 対 比べる元 ${c3(a1.Q3.baseline_rate)}。`, src: "olm112 read.json Q1 · Q2 · Q3 · Q4_by_label_json" },
        { id: "K59", lv: "L1", text: `frontier の段を与えた続き: 二等分線の段まで → 直角 ∧ Thales の逆 ${a4.Q1.RA_and_THC} / ${a4.Q1.k1_rows}(Opus の文 ${a4.fam.k1.opus.RA_and_THC} / 20・Fable の文 ${a4.fam.k1.fable.RA_and_THC} / 20・Q1 続ける)・直角の段まで → Thales の逆 ${a4.Q2.THC} / ${a4.Q2.k2_rows}(${a4.fam.k2.opus.THC} / 20・${a4.fam.k2.fable.THC} / 20・Q2 続ける)。k = 0 は答えの欄が apex ${a4.Q3.bind} / ${a4.Q3.k0_rows} で関門 ✗(読まない)。`, src: "olm114 read.json Q1 · Q2 · Q3 · gates" },
        { id: "K60", lv: "L1", text: `blocked の書き始め(位置 0)と凍結の label: 一致率 ${Math.round(v.Q1_concordance * v.Q1_N)} / ${v.Q1_N} = ${c3(v.Q1_concordance)}(Q1 保たれない)・JSON から書き始める行は cue \\n ${cell.nl.json} / ${cell.nl.n}・" " ${cell.space.json} / ${cell.space.n}・\\n\\n ${cell.nlnl.json} / ${cell.nlnl.n}(Q2 \\n ${fmt.f2(v.Q2_nl_diff)} 動く・" " ${fmt.f2(v.Q2_space_diff)} 逆)。陽性統制 C0 ✓(cue \\n\\n で K07 の 3 / 3・7 / 7)。`, src: "olm128 read.json blocked_cells · verdicts" },
        { id: "K61", lv: "L1", text: `事後の記述(判定でない・凍結に無い): JSON が 100 字以内にある行: cue \\n ${E.nl.early} / ${E.nl.n}(bind ${E.nl.early_bind})・" " ${E.sp.early} / ${E.sp.n}(bind ${E.sp.early_bind})・\\n\\n ${E.nn.early} / ${E.nn.n}(bind ${E.nn.early_bind})。cue " " の最初の JSON は ${cs.space_first.slice(0, 3).join("・")} 字目(3 行)と ${cs.space_first.filter((x) => x >= 70 && x <= 90).length} 行の ${Math.min(...cs.space_first.filter((x) => x >= 70 && x <= 90))}〜${Math.max(...cs.space_first.filter((x) => x >= 70 && x <= 90))} 字目。`, src: "pack_moy1.py 8g(raw の行から数え直し)· RESULT olm128 §3" },
        { id: "K62", lv: "L1", text: `X1〜X4 が O1・O2 に張る角 ∠O1 Xk O2 = ${G.ang_O.map((a) => a.toFixed(4) + "°").join(" / ")}(90° から ${Math.max(...G.ang_O.map((a) => Math.abs(a - 90))).toFixed(4)}° 以内)。He・Hi に張る角は ${G.ang_H.map((a) => a.toFixed(2) + "°").join(" / ")}。`, src: "prompts.open の座標から計算(pack · data.mjs · check_claims)" },
        { id: "K63", lv: "L1", text: `F5a-2 の編集は一か所: 「${Q.f5.edit.key}」→「${Q.f5.edit.replacement.replace(/\n/g, " ")}」。F5a-2・F5b-1 の cue はどちらも \\n\\n(5 章の行の cue)。`, src: "f5_runs_F5a-2.json edits_applied · cue · f5_runs_F5b-1.json cue" },
        { id: "K64", lv: "L1", text: `base(cue \\n\\n): open は attractor ${Q.think.base.open.labels_no_cap["B-attractor"]}・stuck-L1 ${Q.think.base.open.labels_no_cap["B-stuck-L1"]}(上限で切れた ${Q.think.base.open.cap} 行を除く = PREREG pc1 §6・全行込み attractor ${Q.think.base.open.labels["B-attractor"]} / ${Q.think.base.open.n})・blocked は bind ${Q.think.base.blocked.labels["B-bind"]}・attractor ${Q.think.base.blocked.labels["B-attractor"]}。Think(Q4)は open が stuck-L1 ${Q.think.open.labels["B-stuck-L1"]} / ${Q.think.open.labels["B-stuck-L1"]}・blocked が bind ${Q.think.blocked.labels["B-bind"]} / ${Q.think.blocked.labels["B-bind"]}(length の行を除く)。`, src: "pc1_runs.json label · screen_olmo-3_32b.json" },
        { id: "K65", lv: "L1", text: `出来事の行の道 × label(答えの欄): O1O2 の ${ag.o_diam.n} 行 = ${Object.entries(bk).sort((a, b) => b[1] - a[1]).map(([k2, n]) => `${k2.replace("|B-", " × ")} ${n}`).join("・")}。He・Hi の ${ag.h_diam.n} 行 = ${Object.entries(hk).sort((a, b) => b[1] - a[1]).map(([k2, n]) => `${k2.replace("|B-", " × ")} ${n}`).join("・")}。`, src: "rows/*.npz の meta(kind · label_json)の数え上げ · olm59 read.json counts" },
        { id: "K66", lv: "L1", text: `S_O の「同じ円を語で言う文」(${o59.S_O.wordcirc.text})は token ${o59.S_O.wordcirc.tok_a}〜${o59.S_O.wordcirc.tok_b}(出来事の token ${o59.S_O.event} の ${-o59.S_O.wordcirc.k_a} 〜 ${-o59.S_O.wordcirc.k_b} token 前)で、O1・O2 の名を含まず述語に当たらない(「前 32」の窓の内)。`, src: "olm59 rows/F5a-2__think__r15.npz の text · starts · ends" },
        { id: "K67", lv: "L1", text: `札の外の数(L2・判定に使わない): 同順位を平均した順位相関は O1O2 ${c3(tie.o_diam)}・He・Hi ${c3(tie.h_diam)}・全 token ${c3(tie.pooled)}。札の規則(同順位を順に並べる)の値は ${c3(Q.o62.read.o_diam.spearman_mid_math)} / ${c3(Q.o62.read.h_diam.spearman_mid_math)} / ${c3(Q.o62.read.Q3_pooled_token_spearman_mid_math)}。`, src: "pack_moy1.py 8d(average_rank)· check_claims.py" },
        { id: "K68", lv: "L1", text: `olm62 の Q2 は二つの規則を持つ(PREREG): 対象が 8 本未満なら「読まない」・閾は 60 %。数式に移らない O1O2 の出来事は ${Q.flat.n} 本(8 本以上 = 読む)で、中点が上がるのは ${Q.flat.up} 本(${pc(Q.flat.up, Q.flat.n)} % ≥ 60 % ✓・余裕 ${Q.flat.up - Q.flat.need} 本)。`, src: "PREREG olm62 の Q2 の文 · olm62 read.json mid_up_when_math_flat" },
        { id: "K69", lv: "L1", text: `blocked s8 は JSON が無く、答えの欄が無い。凍結の label_json_fields は、JSON の無い行を cmt5 の ${Q.cmt5.noJson.n} / ${Q.cmt5.noJson.n} 行で B-flail にする。blocked の答えの欄は O1O2 ${Q.blk.o1o2}・He・Hi ${Q.blk.hehi}・JSON なし ${Q.blk.other}(全文の label が bind の s8 を含む)。`, src: "cmt5.json rows[*].label_json_fields · pack_moy1.py の answer field" },
        { id: "R07", lv: "L3", text: "台帳の読み R04 → olm76 のつながり: 台帳の読みが「答えの欄の始まりで結びは上がるか」という問いを生み、家が olm76 に打った。(読み: RESULT 駅 2 §2 の実行層。採否は人間)", src: "RESULT 駅 2 §2 · K51" },
        { id: "R08", lv: "L3", text: `位置を対の文の物に入れ替えると、行いが指しに従う割合は選びの位置だけで層 ${A.struct.layers.sel_drop} で 0.5 を割り(olm106)、選びから最後までの組は層 ${A.struct.layers.tail_switch} で値の側へ替わり(olm108)、最後の位置だけは層 ${A.struct.layers.end_val_first} から値に従う(olm101)、と読める。「変数」「pointer」は文の組の名で、model の中の型の主張ではない(SCOPE 11-01 §2b)。(読み: RESULT olm106 / olm108 の主 session。採否は依頼者)`, src: "RESULT olm106 §読み · olm108 §読み · K57" },
        { id: "R09", lv: "L3", text: "frontier の証明の欄を段で与えると、OLMo は与えられた段の続きを書ける。直交から直角へ進む文がある続きは 12 / 40(正規表現・計器の外)で、「OLMo が導いた」とは言わない。(読み: RESULT olm114 §6 の主 session。採否は依頼者)", src: "RESULT olm114 §6 · K59" },
        { id: "R10", lv: "L3", text: "位置 0 の書き始めは cue \\n と \\n\\n の対比は説明の向きに見せるが、cue \" \" の行を取りこぼす(「文から書き始める」のではなく「問いの決まりの一文を足してから JSON」に入る)。計器の境(位置 0)が cue に敏感で、Q1 の「保たれない」は、書き始めの考えが外れたのか境の置き方が外れたのかを分けない。(読み: RESULT olm128 §4 の主 session。採否は依頼者)", src: "RESULT olm128 §4 · K60 · K61" },
        { id: "R11", lv: "L3", text: "天秤のたとえ(皿 = 組の寄与・梁 = 出力の Δ)は、この図の作り手の描き方で、機構の主張ではない。(読み: 作り手の描き方。採否は人間)", src: "状態 13・14" },
        { id: "X17", lv: "x", text: "「結び」が答えの欄の手前で立つ、とは言わない(olm76: bind の行で線に届かず、attractor の行より上でもない)。", src: "K51" },
        { id: "X18", lv: "x", text: "推論空間の候補が在る(線 +0.05)とは言わない。同時に「推論空間が無い」とも言わない(四つの出来事・この計器で見えないだけ)。", src: "K52 · K53" },
        { id: "X19", lv: "x", text: "k = 8 の上乗せが「推論」「計画」「先の見込み」とは言わない(上乗せの中身は分けていない)。「三語・位置・話題は先読みに情報を持たない」とも言わない(W+ の罰則 C は較正していない)。", src: "K53 · olm92 §5" },
        { id: "X20", lv: "x", text: "「行き先がまだ決まっていない」「残差に結末の情報が無い」とは言わない(olm91 は最初の 64 token の窓の平均で、四つの表現とも読めなかった、まで)。", src: "K54" },
        { id: "X21", lv: "x", text: "「model は束縛を解く」は行い(98 %)と線形の読みの記述で、model が「分かっている」とは言わない。this circle の形が行いに使われる、とは言わない(olm97)。", src: "K55 · olm94 Q0 · olm97" },
        { id: "X22", lv: "x", text: "機構・回路は言わない: head の間の道(path patching)は見ていない・注意の重みは「どこを読むか」で「何を写すか」ではない・DLA は一次の分解・5 個の重なりは同じ語を扱う文どうしで、汎化した部品とは言わない。", src: "K56" },
        { id: "X23", lv: "x", text: "位置の入れ替えは一つの位置・一つの層ずつのまるごとで、動かさないことは持たないことではない。指しは順と名が重なる組・合成の文・V 型だけ。DAS の層 20〜24 の効きはまるごとより強く、錯覚の型。", src: "K57 · olm101 §言えないこと" },
        { id: "X24", lv: "x", text: "CHAIN は語の鎖で、証明の正しさの検証ではない。「OLMo が導いた」とは言わない(与えられた段の続きを書けた、まで)。base と chat model の差には能力の差と調整の差が混ざる。", src: "K58 · K59" },
        { id: "X25", lv: "x", text: "olm128 は因果を言わない(書き始めを替えた腕は無い)。事後の「100 字以内」の揃いは判定でなく、100 は見てから置いた数。「書き始めで説明される」とは言わない。", src: "K60 · K61" },
        { id: "X26", lv: "x", text: "frontier の model の中身の話ではない(線 1 の札は OLMo-3 32B base の自分の生成と合成の文)。一つの prompt・一つの model の外へは言わない。", src: "K50〜K61" },
        { id: "X27", lv: "x", text: "blocked s8 の答えの欄は「JSON なし」で、O1O2 と読まない(最後の段落は O1O2 と読めるが、それは凍結の label_json_fields の読み方ではない・pc1 の行へは外挿)。", src: "K69" },
      ] : [
        { id: "K50", lv: "L1", text: `The ${A.cards.length} later cards were frozen (PREREG + runner in one commit; ${A.cards.filter((c) => c.grade !== "読まない(関門 ✗)").length} read, ${A.cards.filter((c) => c.grade === "読まない(関門 ✗)").map((c) => c.id).join(", ")} not; olm76 re-frozen →, before reading). Frozen commits (the RESULT's first line · equal to the commit in which git first added the PREREG): ${A.cards.map((c) => `${c.id} ${c.freeze}${c.id === "olm76" ? ` → ${c.read_commit}` : ""}`).join(" · ")}.`, src: "the first line of each RESULT · git log --diff-filter=A of the PREREG" },
        { id: "K51", lv: "L1", text: `Rows where the close group rises in the 64 tokens before the answer field {": bind ${l3.q1.pos} / ${l3.q1.n} (median ${f3_(l3.q1.median)} · sign test p ${c3(l3.q1.sign_p)}) · false window ${l3.pseudo.pos} / ${l3.pseudo.n} (p ${c3(l3.pseudo.sign_p)}) · attractor ${l3.attr.pos} / ${l3.attr.n} (median ${f3_(l3.attr.median)}). Q1 ✗ · Q3 ✗ (bind minus attractor ${f3_(l3.q3.diff)} · perm p ${c3(l3.q3.perm_p)}). The COMMIT positive control C3 is ${l3.commit_c3.pos} / ${l3.commit_c3.n} (line 15) ✗.`, src: "olm76 read.json Q1_bind_close_rises · Q3_close_bind_gt_attractor · control.json C2_pseudo_window · C3_commit_positive" },
        { id: "K52", lv: "L1", text: `Layer-32 probe AUC vs the J-lens readout: ${sp.look.map((x) => `${x.card} ${c3(x.auc.L32.med)} vs ${c3(x.auc.J.med)} (E ${f3_(x.E.L32.med)})`).join(" · ")}. Q1 ✗ in all three (the frozen false condition).`, src: "auc · E of olm84 Q1 · olm85 Q1_next_sentence_O · olm86 Q1_k32" },
        { id: "K53", lv: "L1", text: `Median E at k = 8 (layer 32 / layer 48): olm86 ${f3_(ky.olm86["8"].L32)} / ${f3_(ky.olm86["8"].L48)} · olm89 ${f3_(ky.olm89["8"].L32)} / ${f3_(ky.olm89["8"].L48)} (Q1 ✓ on +0.02, set after olm86 · Q1b ✗) · olm92 ${f3_(ky.olm92["8"].L32)} / ${f3_(ky.olm92["8"].L48)}. olm92's E+ (layer 32) = ${f3_(sp.plus.L32.med)} [${f3_(sp.plus.L32.p05)}, ${f3_(sp.plus.L32.p95)}] "${sp.plus.branch}" (stays).`, src: "E · E_old · E_plus of olm86 Q2_desc_by_k · olm89 Q1_k8 · olm92 Q_k8" },
        { id: "K54", lv: "L1", text: `The end of the answer field from the first 64 tokens (${sp.first64.rows} rows · attractor ${sp.first64.attractor}): AUC layer 32 ${c3(sp.first64.auc.L32.med)} · layer 48 ${c3(sp.first64.auc.L48.med)} · J ${c3(sp.first64.auc.J.med)} · bag of words ${c3(sp.first64.auc.W.med)}. All inside the null band (labels permuted between rows; layer 32 null ${c3(sp.first64.null.p05)} to ${c3(sp.first64.null.p95)}) = Q1 ✗.`, src: "olm91 read.json Q1_first64 · control.json C3_perm_null" },
        { id: "K55", lv: "L1", text: `The AUC with which the form just after a name moves to "this circle" (olm94 Q2 ✓): layer 32 ${c3(rf.olm94_q2.to_dem.L32)} · layer 48 ${c3(rf.olm94_q2.to_dem.L48)} · J ${c3(rf.olm94_q2.to_dem.J)} · bag of words ${c3(rf.olm94_q2.to_dem.W)}; to the word before "this" ${c3(rf.olm94_q2.to_ctl.L32)} · ${c3(rf.olm94_q2.to_ctl.L48)}. In olm93 (natural generation) layer 32 is ${c3(rf.olm93_q1.L32)}, and the bag of words' same transfer (${c3(rf.olm93_q1.W)}) is higher.`, src: "olm94 read.json Q2_V_post_to_dem_vs_ctl · olm93 Q1_name_to_dem" },
        { id: "K56", lv: "L1", text: `The top-10 heads that carry the behaviour at the final position read the referent's diameter name ${hd.ratio.toFixed(2)} times as much as the other (attention ${c3(hd.share.ref_name)} vs ${c3(hd.share.oth_name)}). Putting their output to the paired sentence's moves the behaviour ${fmt.f2(hd.e_top)} logit (vs random 10 heads ${fmt.f2(hd.top_minus_rand)} · flip ${c3(hd.flip)}). ${hd.overlap.length} of the top 10 (${hd.overlap.join(", ")}) are cmt13's heads.`, src: "olm98 read.json Q1_top_heads_read_ref_name · Q2_patch_top_heads · Q4_cmt13_overlap" },
        { id: "K57", lv: "L1", text: `Share of the behaviour that followed the source's pointer / value when a position is swapped (evaluation pairs): the selector letter alone (olm106) pointer ${c3(g(ly.sel, 12, "po"))} at layer 12 · ${c3(g(ly.sel, 16, "po"))} at 16 · ${c3(g(ly.sel, 20, "po"))} at 20 (value ≤ ${c3(ly.sel.reduce((m, r2) => Math.max(m, r2.vo), 0))}) · the final position alone (olm101) first follows the value at layer ${ly.end_val_first} (${c3(g(ly.end, 28, "vo"))} at 28) · selector to end (olm108) at layer 20 pointer ${c3(g(ly.tail, 20, "po"))} / value ${c3(g(ly.tail, 20, "vo"))}.`, src: "olm106 table.sel_L* · olm101 Q1_curve_full_end · olm108 Q1.curve_tail" },
        { id: "K58", lv: "L1", text: `Proof fields of the ${a1.Q1.bind} rows whose answer field is the apex: bisector ${a1.bind.BIS} · right angle ${a1.bind.RA} · converse of Thales ${a1.bind.THC} · chain (all three) ${a1.Q1.chain} (Q1 false). Declared a hypothesis: apex ${a1.Q2.bind_hyp} / ${a1.Q2.bind_hq} · attractor ${a1.Q2.attr_hyp} / ${a1.Q2.attr_hq}. Attractor rate ${c3(a1.Q3.new_rate)} vs the baseline ${c3(a1.Q3.baseline_rate)}.`, src: "olm112 read.json Q1 · Q2 · Q3 · Q4_by_label_json" },
        { id: "K59", lv: "L1", text: `Continuations of the frontier's steps: given up to the bisector step → right angle ∧ converse of Thales ${a4.Q1.RA_and_THC} / ${a4.Q1.k1_rows} (Opus's sentence ${a4.fam.k1.opus.RA_and_THC} / 20 · Fable's ${a4.fam.k1.fable.RA_and_THC} / 20 · Q1 continues) · given up to the right-angle step → converse of Thales ${a4.Q2.THC} / ${a4.Q2.k2_rows} (${a4.fam.k2.opus.THC} / 20 · ${a4.fam.k2.fable.THC} / 20 · Q2 continues). k = 0 has the apex as the answer field in ${a4.Q3.bind} / ${a4.Q3.k0_rows}: gate ✗ (not read).`, src: "olm114 read.json Q1 · Q2 · Q3 · gates" },
        { id: "K60", lv: "L1", text: `Blocked rows' start (position 0) and the frozen label: concordance ${Math.round(v.Q1_concordance * v.Q1_N)} / ${v.Q1_N} = ${c3(v.Q1_concordance)} (Q1 not kept) · rows that start with the JSON: cue \\n ${cell.nl.json} / ${cell.nl.n} · " " ${cell.space.json} / ${cell.space.n} · \\n\\n ${cell.nlnl.json} / ${cell.nlnl.n} (Q2 \\n ${fmt.f2(v.Q2_nl_diff)} moves · " " ${fmt.f2(v.Q2_space_diff)} reversed). Positive control C0 ✓ (cue \\n\\n reproduces K07's 3 / 3 and 7 / 7).`, src: "olm128 read.json blocked_cells · verdicts" },
        { id: "K61", lv: "L1", text: `After-the-fact description (not a verdict · not frozen): rows with the JSON within 100 characters: cue \\n ${E.nl.early} / ${E.nl.n} (bind ${E.nl.early_bind}) · " " ${E.sp.early} / ${E.sp.n} (bind ${E.sp.early_bind}) · \\n\\n ${E.nn.early} / ${E.nn.n} (bind ${E.nn.early_bind}). With cue " " the first JSON sits at character ${cs.space_first.slice(0, 3).join(", ")} (3 rows) and in ${cs.space_first.filter((x) => x >= 70 && x <= 90).length} rows at ${Math.min(...cs.space_first.filter((x) => x >= 70 && x <= 90))}-${Math.max(...cs.space_first.filter((x) => x >= 70 && x <= 90))}.`, src: "pack_moy1.py 8g (recounted from the raw rows) · RESULT olm128 §3" },
        { id: "K62", lv: "L1", text: `The angle ∠O1 Xk O2 that X1-X4 subtend at O1, O2 = ${G.ang_O.map((a) => a.toFixed(4) + "°").join(" / ")} (within ${Math.max(...G.ang_O.map((a) => Math.abs(a - 90))).toFixed(4)}° of 90°). The angle subtended at He, Hi is ${G.ang_H.map((a) => a.toFixed(2) + "°").join(" / ")}.`, src: "computed from the coordinates of prompts.open (pack · data.mjs · check_claims)" },
        { id: "K63", lv: "L1", text: `The F5a-2 edit is one place: "${Q.f5.edit.key}" → "${Q.f5.edit.replacement.replace(/\n/g, " ")}". The cue of F5a-2 and F5b-1 is \\n\\n in both (the cue of chapter 5's rows).`, src: "f5_runs_F5a-2.json edits_applied · cue · f5_runs_F5b-1.json cue" },
        { id: "K64", lv: "L1", text: `Base (cue \\n\\n): open is attractor ${Q.think.base.open.labels_no_cap["B-attractor"]} · stuck-L1 ${Q.think.base.open.labels_no_cap["B-stuck-L1"]} (${Q.think.base.open.cap} row cut at the cap left out = PREREG pc1 §6; all rows ${Q.think.base.open.labels["B-attractor"]} / ${Q.think.base.open.n}) · blocked is bind ${Q.think.base.blocked.labels["B-bind"]} · attractor ${Q.think.base.blocked.labels["B-attractor"]}. Think (Q4): open stuck-L1 ${Q.think.open.labels["B-stuck-L1"]} / ${Q.think.open.labels["B-stuck-L1"]} · blocked bind ${Q.think.blocked.labels["B-bind"]} / ${Q.think.blocked.labels["B-bind"]} (rows cut at length removed).`, src: "pc1_runs.json label · screen_olmo-3_32b.json" },
        { id: "K65", lv: "L1", text: `Path × label (answer field) of the event rows: the ${ag.o_diam.n} O1O2 rows = ${Object.entries(bk).sort((a, b) => b[1] - a[1]).map(([k2, n]) => `${k2.replace("|B-", " × ")} ${n}`).join(" · ")}. The ${ag.h_diam.n} He-Hi rows = ${Object.entries(hk).sort((a, b) => b[1] - a[1]).map(([k2, n]) => `${k2.replace("|B-", " × ")} ${n}`).join(" · ")}.`, src: "a count of the meta (kind · label_json) of rows/*.npz · olm59 read.json counts" },
        { id: "K66", lv: "L1", text: `S_O's sentence that says the same circle in words (${o59.S_O.wordcirc.text}) sits at tokens ${o59.S_O.wordcirc.tok_a}-${o59.S_O.wordcirc.tok_b} (${-o59.S_O.wordcirc.k_a} to ${-o59.S_O.wordcirc.k_b} tokens before the event token ${o59.S_O.event}); it names neither O1 nor O2 and hits no predicate (inside the "before 32" window).`, src: "text · starts · ends of olm59 rows/F5a-2__think__r15.npz" },
        { id: "K67", lv: "L1", text: `A number outside the card (L2 · not used for a verdict): the rank correlations with ties averaged are O1O2 ${c3(tie.o_diam)} · He-Hi ${c3(tie.h_diam)} · all tokens ${c3(tie.pooled)}. With the card's rule (ties put in order) the values are ${c3(Q.o62.read.o_diam.spearman_mid_math)} / ${c3(Q.o62.read.h_diam.spearman_mid_math)} / ${c3(Q.o62.read.Q3_pooled_token_spearman_mid_math)}.`, src: "pack_moy1.py 8d (average_rank) · check_claims.py" },
        { id: "K68", lv: "L1", text: `olm62's Q2 holds two rules (PREREG): not read if fewer than 8 events · threshold 60 %. The O1O2 events that do not move into formulas are ${Q.flat.n} (8 or more = read), and the mid group rises in ${Q.flat.up} (${pc(Q.flat.up, Q.flat.n)} % ≥ 60 % ✓ · margin ${Q.flat.up - Q.flat.need}).`, src: "PREREG olm62's Q2 sentence · olm62 read.json mid_up_when_math_flat" },
        { id: "K69", lv: "L1", text: `blocked s8 has no JSON, so no answer field. The frozen label_json_fields gives B-flail to the ${Q.cmt5.noJson.n} / ${Q.cmt5.noJson.n} rows without JSON in cmt5. blocked's answer field is O1O2 ${Q.blk.o1o2} · He-Hi ${Q.blk.hehi} · no JSON ${Q.blk.other} (including s8, whose whole-text label is bind).`, src: "cmt5.json rows[*].label_json_fields · the answer field of pack_moy1.py" },
        { id: "R07", lv: "L3", text: "The link ledger R04 → olm76: the ledger's reading raised the question \"does the close group rise at the start of the answer field?\" and the home struck it as olm76. (Reading: the executing layer, RESULT station 2 §2. Adoption is the human's.)", src: "RESULT station 2 §2 · K51" },
        { id: "R08", lv: "L3", text: `When positions are swapped for the paired sentence's, the share of the behaviour following the pointer drops below 0.5 at layer ${A.struct.layers.sel_drop} with the selector's position alone (olm106), the set from the selector to the end switches to the value at layer ${A.struct.layers.tail_switch} (olm108), and the final position alone follows the value from layer ${A.struct.layers.end_val_first} (olm101), so it reads. "Variable" and "pointer" name the pairs of sentences, not a type inside the model (SCOPE 11-01 §2b). (Reading: the main session of RESULT olm106 / olm108. Adoption is the teacher's.)`, src: "RESULT olm106 / olm108 readings · K57" },
        { id: "R09", lv: "L3", text: "Given the frontier's proof field in steps, OLMo can write the continuation of the given steps. Continuations with a sentence going from perpendicularity to the right angle are 12 / 40 (a regex · outside the instrument); \"OLMo derived it\" is not said. (Reading: the main session of RESULT olm114 §6. Adoption is the teacher's.)", src: "RESULT olm114 §6 · K59" },
        { id: "R10", lv: "L3", text: "The start at position 0 makes the contrast of cue \\n and \\n\\n look like an explaining direction but misses the rows of cue \" \" (it does not \"start with a sentence\"; it adds one sentence of the question's fixed phrasing and then enters the JSON). The instrument's boundary (position 0) is sensitive to the cue, and Q1's \"not kept\" does not separate whether the idea about the start was wrong or the way the boundary is set. (Reading: the main session of RESULT olm128 §4. Adoption is the teacher's.)", src: "RESULT olm128 §4 · K60 · K61" },
        { id: "R11", lv: "L3", text: "The balance metaphor (pan = a pair's contribution · beam = the output's Δ) is how this figure's maker drew it, not a claim about mechanism. (Reading: the maker's way of drawing. Adoption is the human's.)", src: "states 13, 14" },
        { id: "X17", lv: "x", text: "We do not say that close stands before the answer field (olm76: in bind rows it does not reach the line, and it is not above attractor).", src: "K51" },
        { id: "X18", lv: "x", text: "We do not say that an inference-space candidate exists (the +0.05 line). Equally we do not say there is none (the four events and this instrument simply do not show it).", src: "K52 · K53" },
        { id: "X19", lv: "x", text: "The surplus at k = 8 is not called \"inference\", \"planning\" or \"foresight\" (its content is not separated). We do not say that three words, position and topic hold no look-ahead information (the penalty C of W+ was not calibrated).", src: "K53 · olm92 §5" },
        { id: "X20", lv: "x", text: "We do not say \"the destination is not yet decided\" or \"the residual holds no information about the outcome\" (olm91 is the mean over the first 64 tokens; none of the four representations could read it).", src: "K54" },
        { id: "X21", lv: "x", text: "\"The model solves the binding\" is a description of behaviour (98 %) and of a linear readout; we do not say the model \"knows\". We do not say that the form at \"this circle\" is used by the behaviour (olm97).", src: "K55 · olm94 Q0 · olm97" },
        { id: "X22", lv: "x", text: "No mechanism or circuit is claimed: paths between heads (path patching) were not looked at · attention weights say where a head reads, not what it copies · DLA is a first-order decomposition · the overlap of 5 heads is between sentences about the same words and is not called a general-purpose part.", src: "K56" },
        { id: "X23", lv: "x", text: "Whole swaps are of one position at one layer, and not moving the behaviour is not the same as not holding it. The pointer is measured on pairs where order and name coincide · synthetic sentences · V type only. The DAS effect at layers 20-24 is stronger than the whole swap: the illusion pattern.", src: "K57 · olm101 §cannot say" },
        { id: "X24", lv: "x", text: "CHAIN is a chain of words, not a check that a proof is correct. We do not say \"OLMo derived it\" (it wrote the continuation of the given steps). A base-vs-chat difference mixes ability and tuning.", src: "K58 · K59" },
        { id: "X25", lv: "x", text: "olm128 makes no causal claim (no arm changed the start). The after-the-fact lining-up of \"within 100 characters\" is not a verdict, and 100 was set after looking. We do not say \"explained by the start\".", src: "K60 · K61" },
        { id: "X26", lv: "x", text: "This is not about what frontier models hold inside (the line-1 cards are OLMo-3 32B base's own generation and synthetic sentences). Nothing is said beyond one prompt and one model.", src: "K50-K61" },
        { id: "X27", lv: "x", text: "blocked s8's answer field is \"no JSON\" and is not read as O1O2 (its last paragraph reads as O1O2, but that is not how the frozen label_json_fields reads · an extrapolation to pc1's rows).", src: "K69" },
      ]);
